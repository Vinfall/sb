name: Update

on:
  workflow_dispatch:
  schedule:
    # run every 8 hours
    - cron: "20 */8 * * *"
jobs:
  update:
    name: update
    runs-on: windows-latest
    permissions:
      contents: write # required to update
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # required to update
      - uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          SKIP_UPDATED: 1
          SCOOP_BRANCH: develop
